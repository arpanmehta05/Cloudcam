[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rabbittwatch-ai-observability"
version = "0.1.3"
description = "RabbittWatch AI Observability tracing SDK for Python"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "langchain-core>=0.1.0",
    "litellm>=1.0.0",
    "pytest>=7.0.0",
]
